[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earth-platform"
version = "0.1.0"
description = "Earth Intelligence Platform: conversational, Earth-first application layer over SatQuery Engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings[yaml]>=2.4",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "Pillow>=10.4",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/earth_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["earth_platform"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

# ---- Architecture: enforced by `lint-imports` (run in CI) ----------------------------------
[tool.importlinter]
root_package = "earth_platform"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layers: higher layers may import lower ones, never the reverse"
type = "layers"
layers = [
  "earth_platform.main",
  "earth_platform.lifecycle | earth_platform.api",
  "earth_platform.container",
  "earth_platform.plugins | earth_platform.streaming",
  "earth_platform.intelligence",
  "earth_platform.agent",
  "earth_platform.vision",
  "earth_platform.llm | earth_platform.engine | earth_platform.earth | earth_platform.sessions",
  "earth_platform.settings",
  "earth_platform.shared",
]
