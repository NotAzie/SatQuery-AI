[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery-ai"
version = "1.0.0"
description = "An interactive vision-language assistant for multimodal remote sensing image analysis through text queries."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Az" }]
keywords = ["remote-sensing", "vision-language", "satellite", "sar", "vqa", "grounding"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "numpy>=1.24",
  "Pillow>=10.0",
  "httpx>=0.26",
]

[project.optional-dependencies]
# Required to answer any question about an image. Kept separate so that the
# service, the CLI, and `satquery doctor` all install and run on a machine
# that does not yet have torch, and can report what is missing.
vision = ["torch>=2.1", "transformers>=4.38"]
large = ["accelerate", "sentencepiece"]
dev = ["pytest>=8.0"]
eo = [
  "rasterio>=1.4",
  "pyproj>=3.6",
  "shapely>=2.0",
  "pystac>=1.10",
  "pystac-client>=0.8",
]

[project.scripts]
satquery = "satquery.__main__:main"

[tool.setuptools.packages.find]
include = ["satquery*", "plugins*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --tb=short"
markers = [
  "real_acceptance: loads the configured Hugging Face models and runs real-image smoke checks",
]
